<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Screen Desktop Gradient (Windows 11 Bloom Blue) -->
    <linearGradient id="win11-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0067c0" />
      <stop offset="45%" stop-color="#0078d4" />
      <stop offset="100%" stop-color="#00c0f3" />
    </linearGradient>

    <!-- Bloom Glow highlight on screen -->
    <radialGradient id="screen-bloom" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#60cdff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0078d4" stop-opacity="0" />
    </radialGradient>

    <!-- Bezel / Frame Gradient -->
    <linearGradient id="bezel-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>

    <!-- Stand Stem Gradient -->
    <linearGradient id="stem-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Stand Base Gradient -->
    <linearGradient id="base-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="pc-shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.32" />
    </filter>
  </defs>

  <g filter="url(#pc-shadow)">
    <!-- Stand Base -->
    <ellipse cx="32" cy="56" rx="14" ry="3.5" fill="url(#base-grad)" stroke="#94a3b8" stroke-width="0.5" />

    <!-- Stand Stem -->
    <rect x="29.5" y="42" width="5" height="13" rx="1" fill="url(#stem-grad)" />

    <!-- Monitor Bezel Outer Frame -->
    <rect x="7" y="10" width="50" height="34" rx="4.5" fill="url(#bezel-grad)" stroke="#475569" stroke-width="0.75" />

    <!-- Monitor Screen Inner Display -->
    <rect x="9.5" y="12.5" width="45" height="27" rx="2" fill="url(#win11-screen)" />
    <!-- Screen Bloom Light Overlay -->
    <rect x="9.5" y="12.5" width="45" height="27" rx="2" fill="url(#screen-bloom)" />

    <!-- Mini Windows 11 Wallpaper Flower Petals -->
    <path d="M32 23 C30 19, 23 20, 24 25 C25 29, 32 30, 32 27 Z" fill="#ffffff" opacity="0.7" />
    <path d="M32 23 C34 19, 41 20, 40 25 C39 29, 32 30, 32 27 Z" fill="#ffffff" opacity="0.65" />
    <path d="M32 27 C28 26, 25 32, 30 33 C33 34, 32 28, 32 27 Z" fill="#60cdff" opacity="0.8" />
    <path d="M32 27 C36 26, 39 32, 34 33 C31 34, 32 28, 32 27 Z" fill="#60cdff" opacity="0.8" />

    <!-- Screen Bottom Taskbar Strip -->
    <rect x="9.5" y="36.5" width="45" height="3" fill="#003e75" opacity="0.65" />
    <!-- Taskbar centered Windows Logo icon -->
    <rect x="30" y="37.2" width="1.6" height="1.6" fill="#60cdff" />
    <rect x="32" y="37.2" width="1.6" height="1.6" fill="#60cdff" />
    <rect x="30.2" y="37.2" width="3.6" height="1.6" rx="0.3" fill="#ffffff" opacity="0.9" />

    <!-- Front Bezel Chin -->
    <rect x="7" y="41.5" width="50" height="2.5" fill="#1e293b" />
    <!-- Webcam / Status sensor -->
    <circle cx="32" cy="11.2" r="0.6" fill="#64748b" />
  </g>
</svg>
